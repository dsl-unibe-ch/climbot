services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: climebot-qdrant-${VERSION:-latest}
    ports:
      - "127.0.0.1:6333:6333"   # loopback-only; reachable by host ETL, never public
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: climebot-backend:${VERSION:-latest}
    container_name: climebot-backend-${VERSION:-latest}
    environment:
      - QDRANT_HOST=qdrant   # reach the Qdrant service over the compose network
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: climebot-frontend:${VERSION:-latest}
    container_name: climebot-frontend-${VERSION:-latest}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
