# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: "3.9"

services:
  qdrant:
    ports: []          # Remove direct host exposure
    expose:
      - "6333"
    restart: always

  backend:
    ports: []
    expose:
      - "8000"
    restart: always

  frontend:
    ports: []
    expose:
      - "8501"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: climebot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always
