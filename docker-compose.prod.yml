# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  qdrant:
    restart: always   # loopback port (127.0.0.1:6333) is inherited from the base file

  backend:
    env_file: ./backend/.env.prod
    ports: []
    expose:
      - "8000"
    restart: always

  frontend:
    env_file: ./frontend/.env.prod
    ports: []
    expose:
      - "8501"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: climebot-nginx-${VERSION:-latest}
    ports:
      - "127.0.0.1:8080:80"   # loopback-only; VM's reverse proxy forwards here
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
